[package]
name = "ccm"
version = "0.1.0"
edition = "2021"
description = "Claude Code Manager — tmux-backed sidebar TUI for juggling Claude Code sessions"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
portable-pty = "0.8"
vt100 = "0.15"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
parking_lot = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
